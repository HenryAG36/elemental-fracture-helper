name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: compile
        run: python3 -m py_compile elemental_fracture.py setup_helper.py helper_config.py test_helper.py test_setup.py
      - name: unittest
        run: python3 -m unittest test_helper test_setup -v
